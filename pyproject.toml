[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "kblam"
version = "0.0.1"
description = "Knowledge Base augmented Language Model"

readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }

dependencies = [
    # ---- Core HF stack (OLMo3 compatible) ----
    "transformers>=4.57,<5.2",
    "accelerate>=0.26.0",
    "tokenizers>=0.15",
    "safetensors>=0.4",

    # ---- PyTorch ----
    "torch>=2.1",

    # ---- Data & eval ----
    "datasets==4.5.0",
    "evaluate",
    "nltk",
    "rouge-score",
    "bert_score",

    # ---- Retrieval / embeddings ----
    "sentence_transformers",
    "hnswlib",

    # ---- Azure ML stack (unchanged) ----
    "azure-ai-ml",
    "azure-core",
    "azure-identity",
    "azure-mgmt-authorization",

    # ---- Misc ----
    "openai",
    "rich",
    "pytest",
]

[dependency-groups]
dev = [
    "mypy>=1.5.1",
    "pre-commit",
    "pylint>=3.0.0",
    "pytest>=7.4.2",
    "codespell",
    "coverage",
    "ipykernel",
    "jinja2",
    "ruff",
    "pyright",
]

experiment = [
    "lm-eval==0.4.10",
    "wandb",
]

all = ["kblam[dev,experiment]"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*_test.py", "tests/*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.isort]
py_version = 310
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pylint.main]
max-line-length = 120
suggestion-mode = true
py-version = "3.10"

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation"
]

[tool.pylint.basic]
docstring-min-length = 10

[tool.pdm.build]
includes = ["src"]
